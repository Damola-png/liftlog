<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiftLog - Sign In</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <script>
      if(localStorage.getItem('liftlog_auth_token_v1')){
        window.location.replace('index.html');
      }
    </script>

    <img class="login-logo" src="assets/CousinsLogo.png" alt="company logo">

    <div class="auth-box">
      <label>Account</label>
      <div id="auth-logged-out">
        <input id="auth-email" type="email" placeholder="Email">
        <input id="auth-password" type="password" placeholder="Password (min 8 chars)">
        <div class="auth-actions">
          <button class="auth-btn" type="button" onclick="loginUser()">Login</button>
          <button class="auth-btn" type="button" onclick="registerUser()">Create Account</button>
        </div>
        <div class="auth-or">or</div>
        <div id="google-signin" class="google-signin-slot"></div>
      </div>
      <div id="auth-logged-in" style="display:none">
        <div class="auth-user" id="auth-user-email">Signed in</div>
        <button class="auth-btn" type="button" onclick="logoutUser()">Logout</button>
      </div>
      <div class="auth-status" id="auth-status">Login to sync incidents across devices.</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
